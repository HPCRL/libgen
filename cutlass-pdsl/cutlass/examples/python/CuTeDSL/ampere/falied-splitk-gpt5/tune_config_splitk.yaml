# Split-K sweep configuration
# Adds split_k_list to existing tuning dimensions.

cta_list:
  - 128x128x32
  - 128x64x32
  - 64x128x32
  - 64x64x32
  - 64x32x32

stages: [3, 4]

atom_layouts:
  - 1x1x1
  - 2x2x1

layouts: [mnn]

